server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/billiard;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:local-demo-only}
spring.sql.init.mode=always
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ssXXX
app.demo-enabled=true
app.admin-password=${ADMIN_PASSWORD:Admin123!}
app.wechat-appid=${WECHAT_APPID:}
app.wechat-secret=${WECHAT_SECRET:}
server.error.include-message=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
