<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="ball" cx="36%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#4a8a6b"/>
      <stop offset="42%" stop-color="#2b6b50"/>
      <stop offset="100%" stop-color="#0a2118"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eeda9f"/>
      <stop offset="48%" stop-color="#c8a34e"/>
      <stop offset="100%" stop-color="#8c6d2c"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="20%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cue behind -->
  <g opacity="0.90">
    <line x1="22" y1="218" x2="198" y2="66" stroke="#d9ceb2" stroke-width="5" stroke-linecap="round"/>
    <line x1="198" y1="66" x2="232" y2="38" stroke="#c8a34e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- rack triangle -->
  <path d="M128 44 L62 176 L194 176 Z" fill="none" stroke="#2b6b50" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M128 56 L74 168 L182 168 Z" fill="none" stroke="#c8a34e" stroke-width="1.5" stroke-opacity="0.45" stroke-linejoin="round"/>

  <!-- cue ball -->
  <circle cx="128" cy="130" r="38" fill="url(#ball)"/>
  <circle cx="128" cy="130" r="38" fill="url(#sheen)"/>
  <circle cx="128" cy="130" r="42" fill="none" stroke="url(#brass)" stroke-width="1.6"/>

  <!-- racked balls -->
  <circle cx="106" cy="164" r="6.5" fill="#f5f0e2"/>
  <circle cx="150" cy="164" r="6.5" fill="#f5f0e2"/>
</svg>
