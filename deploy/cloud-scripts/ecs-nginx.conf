server {
    listen 80;
    server_name yongzhoushengtai.homes www.yongzhoushengtai.homes;
    return 301 https://www.yongzhoushengtai.homes$request_uri;
}

server {
    listen 443 ssl;
    server_name www.yongzhoushengtai.homes;

    ssl_certificate /etc/ssl/shengtai/fullchain.pem;
    ssl_certificate_key /etc/ssl/shengtai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/shengtai/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
