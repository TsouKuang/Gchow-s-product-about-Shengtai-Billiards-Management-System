<!doctype html>
<html lang="zh-CN">
  <meta charset="UTF-8" /><meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
  /><title>服务器设置</title
  ><style>
    body {
      font: 15px Microsoft YaHei;
      background: #f4f6f1;
      padding: 25px;
      color: #234e36;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #cedac5;
      border-radius: 6px;
      margin: 16px 0;
    }
    button {
      background: #285c40;
      color: white;
      border: 0;
      padding: 12px 22px;
      border-radius: 6px;
      cursor: pointer;
    }
    p {
      font-size: 12px;
      color: #87977c;
      line-height: 1.8;
    }
    #error {
      color: #b35443;
    }
  </style>
  <h2>连接台球业务服务器</h2>
  <p>
    本机调试：http://127.0.0.1:8080<br />正式上线：填写你的HTTPS业务服务器域名。小程序和PC客户端共用此服务器。
  </p>
  <input id="url" aria-label="服务器地址" /><button id="save">测试连接并保存</button>
  <p id="error"></p>
  <script>
    connection.get().then((v) => (document.querySelector('#url').value = v));
    document.querySelector('#save').onclick = async () => {
      try {
        document.querySelector('#save').disabled = true;
        await connection.save(document.querySelector('#url').value);
      } catch (e) {
        document.querySelector('#error').textContent = e.message;
      } finally {
        document.querySelector('#save').disabled = false;
      }
    };
  </script>
</html>
